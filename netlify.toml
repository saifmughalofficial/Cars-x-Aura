# Optional static hosting (free Netlify plan): the game is plain HTML/JS, no build step.
# Connect the GitHub repo in Netlify (or drag the frontend/ folder onto app.netlify.com/drop).
[build]
  publish = "frontend"

[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
